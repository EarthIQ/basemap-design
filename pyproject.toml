[project]
name = "earthiq-basemap"
version = "0.2.0"
description = "EarthIQ Basemap - AI base map designer by EarthIQ: describe a map in plain English and an LLM agent edits a live MapLibre GL style on OpenFreeMap vector tiles."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "EarthIQ" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = []

[tool.uv]
package = false
